name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "${REF_TYPE}" == "tag" ]; then
            echo "VERSION=${REF_NAME}" >> $GITHUB_ENV
          else
            BUILD_VERSION="0.0.${RUN_NUMBER}"
            echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
          fi
      - name: Write version to __init__.py
        run: echo "__version__ = '${VERSION}'" > numbduck/__init__.py

      - name: Build release distributions
        run: |
          python -m pip install build==1.2.2.post1 wheel==0.45.0
          git clean -Xfd
          python -m build --wheel

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest

    needs:
      - release-build

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/numbduck/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
