name: haversine_bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Write version to __init__.py
      run: echo "__version__ = '0.0.1'" > numbduck/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "numpy==1.26.4" "pyarrow==14.0.0" "numba==0.64.0" "duckdb==1.5.1"
        pip install -e .
    - name: Run haversine benchmark
      run: NUMBDUCK_BENCH_BIG=1 python examples/haversine.py
