[build-system]
requires = ["setuptools~=75.3.0", "wheel~=0.45.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["numbduck*"]

[project]
name = "numbduck"
dependencies = [
    "duckdb>=1.3.2,<1.6",
    "numbox>=0.6.2"
]
dynamic = ["version"]
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["duckdb", "numba", "numpy"]
authors = [
  {name = "NumbDuck GitHub Repository Contributors"}
]
readme = "README.md"

[tool.pytest.ini_options]
markers = [
    "benchmark: slow benchmarks, run only locally (deselected in CI)",
]

[tool.setuptools.dynamic]
version = {attr = "numbduck.__version__"}
